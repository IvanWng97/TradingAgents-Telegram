[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tg_bot"
version = "0.1.0"
description = "Telegram bot wrapper around TradingAgents."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # [rate-limiter] pulls in `aiolimiter` so AIORateLimiter can throttle
    # outgoing Telegram requests under per-chat / per-bot caps.
    # [job-queue] pulls in `apscheduler` so /digest can run_daily — without
    # this extra, application.job_queue is None and digest scheduling
    # silently no-ops.
    "python-telegram-bot[rate-limiter,job-queue]>=22.7",
    "python-dotenv>=1.2.2",
    "telegraph>=2.2.0",
    "markdown>=3.10.2",
    "beautifulsoup4>=4.14.3",
    # IANA tz database for `zoneinfo` — the python:3.14-slim base image
    # doesn't ship system tzdata, so ZoneInfo("America/Los_Angeles") would
    # raise ZoneInfoNotFoundError without this. Pure-Python wheel, ~700 KB.
    "tzdata>=2026.2",
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git",
]

[project.optional-dependencies]
# Pin dev tooling so local + CI stay in lockstep. Dependabot bumps this
# via PR — bumping the pin re-runs CI on the new version everywhere.
# Note: when bumping `ruff`, also bump the same `rev:` in
# `.pre-commit-config.yaml` so the local hook runs the same version.
dev = [
    "ruff==0.15.12",
    "pre-commit>=4.6.0",
    # pytest runs the `tests/test_*.py` suite (config in
    # [tool.pytest.ini_options] below). pytest-asyncio's auto mode lets
    # `async def test_*` functions run without a per-test marker.
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Default `E + F` (pycodestyle errors + pyflakes) is on by default;
# adding the rest layers in syntax modernization + bug-bear without
# the noise of SIM (mostly stylistic) or RUF's em-dash unicode rules
# (RUF001/002/003 — we use em-dashes deliberately in docstrings).
#
# UP — pyupgrade: Optional[X] → X | None, typing.List → list,
#      timezone.utc → UTC, etc. Auto-fixable; keeps the codebase on
#      modern syntax appropriate to our `requires-python = ">=3.11"`.
# B  — bugbear: catches real bug patterns (mutable defaults, missing
#      `strict=` on zip, unused loop variables, dangling asyncio tasks).
select = ["E", "F", "UP", "B"]
# E501 conflicts with `ruff format`'s own line-length management — the
# formatter intentionally leaves some lines long (f-strings, URLs,
# docstrings with code snippets) where breaking them would hurt
# readability. Ruff's own docs recommend dropping E501 when using
# `ruff format`.
ignore = ["E501"]

[tool.pytest.ini_options]
# Tests live in `tests/` following the pytest standard layout —
# `test_*.py` files discovered automatically (no `python_files` override
# needed). See `tests/conftest.py` for cross-cutting setup (sys.path
# wiring + autouse digest-precheck disable). 235 scenarios in total.
testpaths = ["tests"]
# `asyncio_mode = "auto"` lets pytest run `async def test_*` directly,
# no `@pytest.mark.asyncio` annotation needed — matches how every test
# in `tests/` is written.
asyncio_mode = "auto"
# Silence the deprecation warning about the default event_loop fixture
# scope changing in a future pytest-asyncio release; pick the new
# function scope explicitly.
asyncio_default_fixture_loop_scope = "function"
