[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tg_bot"
version = "0.1.0"
description = "Telegram bot wrapper around TradingAgents."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "python-telegram-bot>=22.7",
    "python-dotenv>=1.2.2",
    "telegraph>=2.2.0",
    "markdown>=3.10.2",
    "beautifulsoup4>=4.14.3",
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git",
]

[project.optional-dependencies]
# Pin dev tooling so local + CI stay in lockstep. Dependabot bumps this
# via PR — bumping the pin re-runs CI on the new version everywhere.
dev = ["ruff==0.15.12"]

[tool.setuptools.packages.find]
where = ["src"]
