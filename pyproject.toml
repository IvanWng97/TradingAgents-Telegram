[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg_bot"
version = "0.1.0"
description = "Telegram bot wrapper around TradingAgents."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22.7",
    "python-dotenv>=1.0.0",
    "telegraph>=2.2.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12",
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@7e9e7b83c7fcc18d941300b253c6ed24d985788d",
]

[tool.setuptools.packages.find]
where = ["src"]
