name: Smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel an in-flight run when a new commit lands on the same ref — saves
# CI minutes when you push a fixup right after the previous push. Mirrors
# lint.yml's pattern.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: smoke reads code, writes nothing.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps (pytest + pytest-asyncio)
        # Full `pip install -e .[dev]` so dependabot bumps to
        # tradingagents, python-telegram-bot, langchain (transitive),
        # pytest, etc. actually get smoke-tested against this PR.
        # Cold cache ~3-4 min; warm ~30s. `--no-deps` would skip the
        # install path we want to validate.
        run: pip install -e ".[dev]"

      - name: Run pytest
        # `-v` prints per-test PASS/FAIL with the test name so failure
        # detail is visible in the GH Actions log without expanding any
        # collapsible section. `--tb=short` keeps tracebacks scannable
        # in the log. `--junitxml` emits a machine-readable report that
        # the upload-artifact step archives for download / inline
        # rendering via third-party actions if added later.
        run: pytest tests/ -v --tb=short --junitxml=junit.xml

      - name: Upload JUnit report
        # `if: always()` so the report uploads even when pytest exits
        # non-zero — that's exactly when the report is most useful.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: junit.xml
          # 7 days is enough for the typical PR review cycle; older
          # reports rarely matter and GH Actions storage is finite.
          retention-days: 7
