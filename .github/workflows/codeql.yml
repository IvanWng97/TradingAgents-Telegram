name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly catch-all in case main hasn't been pushed for a while.
    # Offset 30 min from the daily docker-build cron to avoid runner contention.
    - cron: "30 6 * * 1"

# Cancel an in-flight scan when a new commit lands on the same ref.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    # Defense against a runaway query (typically completes in ~2 min).
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # `security-extended` adds checks beyond the default suite —
          # still free for public repos and modest in CI time.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
