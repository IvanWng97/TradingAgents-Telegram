name: Claude Review

# Dual-trigger structured PR review:
#   1. Auto-fires on `pull_request` (opened / reopened / ready_for_review /
#      synchronize). `synchronize` is included because the job-level
#      `cancel-in-progress: true` below coalesces pushing bursts: a typical
#      PR sees 3-8 pushes while iterating, but the in-flight review is
#      cancelled by each new push, so you get *one* review at the end of
#      the quiescent burst — on the current diff. Burn is modest in
#      practice and matches the anthropics/claude-code-action recommended
#      defaults.
#   2. Manual re-trigger via `/claude-review` comment on a PR. Same rules,
#      same output shape — predictable across both paths.
#
# Free-form `@claude` interactions (fix typos, explain code, etc.) live in
# claude.yml. This file handles structured review only.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    # Gate: auto-fire on PR events (skip dependabot), OR manual /claude-review
    # on an existing PR. Issue comments on non-PR issues are ignored.
    if: |
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/claude-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Concurrency at job-level (not workflow-level) is load-bearing here.
    # `track_progress: true` posts a tracking comment at the START of the
    # review, which fires `issue_comment created` and queues a second run
    # of this workflow. With workflow-level concurrency, that second run
    # would share the group and cancel the in-flight first run before
    # its `if:` gate even evaluates (PR #58 surfaced exactly this). At
    # job-level, the group is only entered AFTER the gate passes — so
    # the tracking-comment re-trigger evaluates `if:` first, skips
    # (body doesn't contain `/claude-review`), and never touches the
    # group. Coalesces PR number across event types: PR events expose
    # number at `event.pull_request.number`; issue_comment events on
    # PRs expose it at `event.issue.number`.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write    # Post inline + tracking comments.
      issues: write           # track_progress posts issue-style tracking comments.
      id-token: write
      actions: read           # Read CI status when reviewing.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0      # Full history for base-branch diff context.

      # Rules + output mechanics live in a markdown file — edit there, not
      # in this YAML. The cat-into-output pattern is needed because the
      # action only accepts an inline `prompt:` string (no `prompt_file:`
      # input in v1 — verified against action.yml on 2026-05-15).
      - name: Load review prompt
        id: load
        run: |
          {
            echo 'prompt<<PROMPT_EOF'
            cat .github/prompts/pr_review_rules.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Built-in progress tracking — creates "Claude is reviewing this
          # pull request..." comment and updates it through the review.
          # Replaces our previous hand-rolled `use_sticky_comment` + hidden
          # marker pattern (the marker stays in the rules.md output spec so
          # it's preserved on the summary comment for forward compat).
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/solutions.md
          track_progress: true
          # Surface tool calls in the run log — load-bearing for
          # distinguishing "found nothing" from "tool denied" (PR #50).
          show_full_output: true
          additional_permissions: |
            actions: read
          # Strict allowlist — gh subcommands hit "requires approval"
          # without this. Pattern lifted from anthropics/claude-code-action
          # docs "Automatic PR Code Review" recipe.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
          prompt: ${{ steps.load.outputs.prompt }}
