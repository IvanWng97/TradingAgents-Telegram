name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel an in-flight run when a new commit lands on the same ref — saves
# CI minutes when you push a fixup right after the previous push.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: lint reads code, writes nothing.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ruff (pinned via pyproject [dev] extra)
        # Use --only-deps via the dev extra spec without installing the
        # package or its tradingagents git dependency — lint doesn't need
        # the runtime, just ruff. Falls back to pinned `pip install ruff`
        # at the version declared in pyproject.toml.
        run: |
          PIN=$(python -c "import tomllib;import sys;d=tomllib.load(open('pyproject.toml','rb'));print([x for x in d['project']['optional-dependencies']['dev'] if x.startswith('ruff')][0])")
          echo "Installing $PIN"
          pip install "$PIN"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .
