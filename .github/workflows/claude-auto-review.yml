name: Claude Auto-Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    # Note: `synchronize` deliberately omitted. A typical PR sees 3-8
    # push events while iterating — auto-reviewing each one burns Claude
    # Code credits on diffs you already know about. To re-review after
    # fixes, comment `@claude review` on the PR (the manual flow in
    # claude.yml takes over).

# Cancel an in-flight review when a new event lands on the same PR.
# Mirrors lint.yml + smoke.yml pacing.
concurrency:
  group: claude-auto-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # Post the review as a PR comment.
  id-token: write        # Required by the Claude Code action.
  actions: read          # So Claude can read CI results when reviewing.

jobs:
  review:
    # Skip dependabot: version bumps with no logic to review; ruff +
    # smoke already catch breakages. Every other author — including the
    # repo owner — gets a review, because the failure mode the workflow
    # exists to prevent (shipping unreviewed code) is most common on
    # author's-own PRs. `synchronize` is still excluded above so a
    # WIP-push loop doesn't burn credits — one review per PR, lifecycle.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so Claude can diff against base for context.
          fetch-depth: 0

      - name: Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Surface the model's full tool calls + responses in the run
          # log. Default `false` is documented as "hides output for
          # security" — relevant when prompts handle secrets. Our prompt
          # only reads public diff + CLAUDE.md, so unhiding the trace
          # lets us diagnose silent-review issues (e.g. permission_
          # denials with no PR comment posted) without re-running.
          show_full_output: true
          additional_permissions: |
            actions: read
          prompt: |
            Review the diff on this pull request against the base branch.

            Read `CLAUDE.md` first — it's the architecture map. The 10
            cross-cutting invariants are the highest-priority check
            surface; flag any violation.

            Focus only on HIGH-confidence findings:
            - Real bugs (correctness, race conditions, security holes,
              missing-await, resource leaks)
            - Invariant violations from CLAUDE.md (especially #1 cache
              key triplet, #3 reply_markup re-attach, #4 parse_mode
              carve-out, #5 cancel race-close)
            - Missing smoke coverage for new code paths (per CLAUDE.md
              Workflow §4 — "new behavior needs a new scenario")
            - Cross-cutting drift (CLAUDE.md / README / smoke /
              handler contracts diverging)
            - Architectural drift: new code that fights the surrounding
              module's patterns (e.g. a new storage class bypassing
              JsonStorage's atomic _save_async), abstractions at the
              wrong layer (UI formatting in storage, storage writes in
              handlers), or file boundaries that don't match the
              existing layout (callback handler living in commands.py).
              HIGH-confidence mismatches against established patterns
              only — not speculative "could be extracted further."
            - Scope creep: new abstractions, parameters, or helpers
              added for hypothetical future requirements (per CLAUDE.md
              Conventions: "Don't add features, refactor, or introduce
              abstractions beyond what the task requires"). A bug fix
              doesn't need surrounding cleanup; a one-shot doesn't need
              a helper. Flag concrete over-engineering, not stylistic
              preference.

            Do NOT flag:
            - Formatting, style, missing docstrings, naming nits
            - "Consider extracting X" / "could refactor further"
            - Anything ruff already catches (ruff CI is a separate
              required check)
            - Speculative future scenarios

            Severity rubric (use these definitions verbatim, don't
            invent your own threshold each run):
            - HIGH: ships a bug, violates a CLAUDE.md invariant, or
              breaks a documented contract. Must fix before merge.
            - MEDIUM: missing test coverage for a new path, doc/code
              drift, unverified handler edge. Worth fixing but not
              blocking.
            - Do not emit LOW. If you'd label it LOW, drop it.

            Output format: a single PR comment. If nothing actionable,
            say exactly "no actionable findings." Otherwise: numbered
            list of findings with file:line, severity (HIGH/MEDIUM),
            and a concrete suggested fix. Cap at 5 findings — pick the
            highest-priority. Reviews longer than that get ignored.

            Keep under 600 words.

      - name: Post review as PR comment
        # The action's `post-buffered-inline-comments.ts` step only
        # posts buffered inline annotations — it never picks up the
        # model's final `result` text. Our prompt asks for a single PR
        # comment, so we parse the execution log directly and post it.
        # `if: always()` because the Claude step's status can be
        # `failure` on workflow-self-mod 401 even though the model still
        # ran and produced output; we want to post in either case.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          OUTPUT="/home/runner/work/_temp/claude-execution-output.json"
          if [ ! -f "$OUTPUT" ]; then
            echo "No execution log at $OUTPUT — nothing to post."
            exit 0
          fi

          # `claude-execution-output.json` may be a JSON array, NDJSON,
          # or concatenated JSON objects depending on action version /
          # mode. Try each format in order until one yields a parseable
          # event list, then walk to the final `type=result` event and
          # extract its `.result` string. First robust pass dumps the
          # first 200 bytes to the log so future format drift is
          # diagnosable without re-running.
          echo "::group::execution-output preview"
          ls -la "$OUTPUT" || true
          head -c 200 "$OUTPUT" 2>/dev/null || true
          echo
          echo "::endgroup::"

          review=$(python3 - "$OUTPUT" <<'PY'
          import json, pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          events = []
          # Format 1: a single JSON value (array of events or single event).
          try:
              parsed = json.loads(text)
              if isinstance(parsed, list):
                  events = parsed
              elif isinstance(parsed, dict):
                  events = [parsed]
          except json.JSONDecodeError:
              pass
          # Format 2: NDJSON (one event per line).
          if not events:
              tried = []
              ok = True
              for line in text.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      tried.append(json.loads(line))
                  except json.JSONDecodeError:
                      ok = False
                      break
              if ok and tried:
                  events = tried
          # Format 3: concatenated JSON objects (pretty-printed back-to-back).
          if not events:
              dec = json.JSONDecoder()
              i = 0
              tried = []
              while i < len(text):
                  while i < len(text) and text[i].isspace():
                      i += 1
                  if i >= len(text):
                      break
                  try:
                      obj, end = dec.raw_decode(text, i)
                      tried.append(obj)
                      i = end
                  except json.JSONDecodeError:
                      break
              events = tried
          last = None
          for ev in events:
              if isinstance(ev, dict) and ev.get("type") == "result":
                  last = (ev.get("result") or "").strip()
          # Diagnostic on the stderr side so failures are visible without
          # leaking content; helps when the parser is empty-handed.
          print(
              f"parser: {len(events)} event(s), last_result={'present' if last else 'absent'}",
              file=sys.stderr,
          )
          if last:
              sys.stdout.write(last)
          PY
          )

          if [ -z "$review" ]; then
            echo "No result text in execution log — nothing to post."
            exit 0
          fi

          # Clean-review sentinel: skip posting so the PR doesn't get
          # a noise comment when the reviewer found nothing.
          if printf '%s' "$review" | grep -qiE "no actionable findings\.?$"; then
            echo "Review is clean ('no actionable findings') — skipping PR comment."
            exit 0
          fi

          # Prepend a header so it's clearly the auto-review, not a
          # human one. The body cap (~65K chars in the GH API) is well
          # above the prompt's 600-word output budget.
          body=$'🤖 **Auto-review** (Claude Code, full review below)\n\n'"$review"
          gh pr comment "$PR_NUMBER" --body "$body"
