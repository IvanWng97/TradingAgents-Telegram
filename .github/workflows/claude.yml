name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Job-level concurrency (not workflow-level) — same load-bearing
    # reason as claude-review.yml: the action's progress-tracking comments
    # fire `issue_comment created` and queue a second run of this
    # workflow. At workflow-level, that second run shares the group and
    # would cancel the first BEFORE its `if:` gate evaluates. At
    # job-level, the group is only entered AFTER the gate passes — so
    # the self-triggered comment is filtered out (body doesn't contain
    # `@claude`) and never touches the group.
    #
    # `cancel-in-progress: true` because the common case is *self-
    # correction*: user taps `@claude fix this`, realizes they meant
    # something else, taps `@claude fix the auth bug specifically`. The
    # first request is stale; running both wastes quota AND posts two
    # responses (one on stale intent). Cancelling the in-flight first
    # run is the right call. Two-different-users case (both tag Claude
    # on the same PR within seconds) is rare; the first user can just
    # re-tap to retry.
    #
    # Group key handles both issue and PR event shapes:
    #   - issue_comment (issue OR PR) → event.issue.number
    #   - pull_request_review         → event.pull_request.number
    #   - issues                      → event.issue.number
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

