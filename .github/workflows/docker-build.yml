name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  schedule:
    # Daily at 06:00 UTC — rebuilds with --no-cache so the pip layer
    # re-resolves upstream tradingagents@HEAD even though pyproject.toml
    # is unchanged.
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  IMAGE_NAME: ivanwng97/tradingagents-telegram
  # ghcr.io requires lowercase owner; matches the Docker Hub repo name so
  # users can pull from either registry with the same image suffix.
  GHCR_IMAGE_NAME: ghcr.io/ivanwng97/tradingagents-telegram

# A second push to the same ref while a build is in flight cancels the older
# run — saves CI minutes when fixing a typo immediately after pushing. Cron +
# manual dispatch each have their own ref, so they don't cancel each other.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Multi-arch + arm64 under QEMU runs ~10–15 min cold, ~3–5 min warm.
    # Cap at 45 min so a stuck run can't burn ~6h of free-tier minutes.
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      # Required for the ghcr.io login + push using GITHUB_TOKEN.
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve upstream tradingagents SHA
        id: ta
        run: |
          SHA=$(git ls-remote https://github.com/TauricResearch/TradingAgents.git HEAD | cut -f1)
          echo "Latest tradingagents SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Look up previously built tradingagents SHA
        id: ta_cache
        uses: actions/cache@v5
        with:
          path: .last-tradingagents-sha
          key: tradingagents-sha-${{ steps.ta.outputs.sha }}

      - name: Decide whether to skip
        id: gate
        run: |
          if [[ "${{ steps.ta_cache.outputs.cache-hit }}" == "true" && "${{ github.event_name }}" == "schedule" ]]; then
            echo "tradingagents@${{ steps.ta.outputs.sha }} already built — skipping schedule run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        # Required for cross-arch builds (linux/arm64 from an amd64 runner).
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.gate.outputs.skip != 'true'
        uses: docker/metadata-action@v6
        with:
          # Multiline list — each tag in `tags:` below is emitted for every
          # image listed here, so the build-push step pushes to both
          # registries in a single multi-arch manifest assembly.
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # ─────────────── Per-arch scan (amd64) ───────────────
      # Single-arch local-load builds so Trivy has a concrete image to scan
      # without going through the registry's multi-arch manifest list (which
      # also contains provenance/SBOM attestation entries that older Trivy
      # versions can't resolve). The same `type=gha` cache is reused by the
      # multi-arch push below, so each arch is built only once.

      - name: Build amd64 image locally for Trivy
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:scan-amd64
          cache-from: ${{ github.event_name == 'push' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
          no-cache: ${{ github.event_name != 'push' }}

      - name: Scan amd64 image with Trivy
        if: steps.gate.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan-amd64
          format: sarif
          output: trivy-results-amd64.sarif
          severity: CRITICAL,HIGH
          # Informational only: don't block the build on findings. Results
          # still upload to the GitHub Security tab so you see them.
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload amd64 Trivy results
        # `category` keeps amd64 and arm64 results distinct in the Code
        # Scanning UI.
        if: steps.gate.outputs.skip != 'true' && !cancelled() && hashFiles('trivy-results-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-amd64.sarif
          category: trivy-amd64

      # ─────────────── Per-arch scan (arm64) ───────────────
      # arm64 is built under QEMU emulation (~3× slower than native) but the
      # cached pip layer dominates so wall-clock cost is small. Worth it to
      # catch arm64-only base-image CVEs before publishing the manifest list.

      - name: Build arm64 image locally for Trivy
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}:scan-arm64
          cache-from: ${{ github.event_name == 'push' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
          no-cache: ${{ github.event_name != 'push' }}

      - name: Scan arm64 image with Trivy
        if: steps.gate.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan-arm64
          format: sarif
          output: trivy-results-arm64.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload arm64 Trivy results
        if: steps.gate.outputs.skip != 'true' && !cancelled() && hashFiles('trivy-results-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-arm64.sarif
          category: trivy-arm64

      # ─────────────── Multi-arch push ───────────────
      # Cache-hot from both per-arch builds above, so this is mostly manifest
      # assembly + push.

      - name: Build and push
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Multi-arch: amd64 covers most VPSes, arm64 unlocks Oracle Cloud
          # Ampere A1 (free tier), Raspberry Pi, and Apple Silicon dev hosts.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain metadata published alongside the image: provenance
          # attests "this image was built by this repo at this commit"; SBOM
          # lists every package in the image. Both visible on Docker Hub.
          provenance: true
          sbom: true
          # Push events (code changes) reuse the layer cache for fast iteration.
          # Schedule + manual dispatch bypass the cache so the `pip install`
          # layer re-resolves tradingagents@HEAD from GitHub.
          cache-from: ${{ github.event_name == 'push' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
          no-cache: ${{ github.event_name != 'push' }}

      - name: Mark tradingagents SHA as built
        # Only after a successful build+push do we record the SHA so the next
        # scheduled run can skip. If the build failed, the file isn't written
        # and actions/cache's post-job save is a harmless no-op.
        if: steps.gate.outputs.skip != 'true'
        run: echo "${{ steps.ta.outputs.sha }}" > .last-tradingagents-sha
